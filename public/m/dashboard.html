<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Mechanic Portal - Velo -garage os</title>
  <link rel="stylesheet" href="/css/base.css" />
  <style>
    /* ===== Mechanic Dashboard Styles ===== */
    .mech-shell {
      max-width: 820px;
      margin: 0 auto;
      padding: 20px 16px 60px;
      min-height: 100vh;
    }

    .mech-topbar {
      display: flex;
      justify-content: space-between;
      align-items: center;
      padding: 16px 20px;
      background: rgba(14, 22, 17, 0.92);
      border: 1px solid rgba(72, 255, 151, 0.16);
      border-radius: 16px;
      margin-bottom: 20px;
      animation: fadeIn 0.4s ease-out;
      flex-wrap: wrap;
      gap: 10px;
    }
    .mech-topbar .brand {
      display: flex;
      align-items: center;
      gap: 10px;
      font-family: var(--font-display);
      font-weight: 700;
      color: var(--green-500);
      text-transform: uppercase;
      letter-spacing: 0.05em;
      font-size: 18px;
    }
    .mech-topbar .brand .dot {
      width: 12px;
      height: 12px;
      border-radius: 50%;
      background: var(--green-500);
      animation: glow 2s ease-in-out infinite;
    }
    .mech-user {
      display: flex;
      align-items: center;
      gap: 10px;
      flex-wrap: wrap;
    }
    .mech-user-info { text-align: right; }
    .mech-user-info .name { color: #fff; font-weight: 600; font-size: 14px; }
    .mech-user-info .code { color: #888; font-size: 11px; font-family: monospace; }
    .mech-avatar {
      width: 40px;
      height: 40px;
      border-radius: 50%;
      background: linear-gradient(135deg, var(--green-500), #25c96f);
      display: flex;
      align-items: center;
      justify-content: center;
      font-size: 18px;
      font-weight: 700;
      color: #07120b;
    }

    .attendance-card {
      padding: 20px 24px;
      display: flex;
      justify-content: space-between;
      align-items: center;
      margin-bottom: 22px;
      animation: slideUp 0.4s ease-out;
      background: linear-gradient(135deg, rgba(14, 22, 17, 0.95), rgba(8, 14, 10, 0.95));
      border: 1px solid rgba(72, 255, 151, 0.16);
      border-radius: 16px;
      flex-wrap: wrap;
      gap: 12px;
    }
    .attendance-left { display: flex; align-items: center; gap: 14px; }
    .status-dot {
      width: 14px;
      height: 14px;
      border-radius: 50%;
      flex-shrink: 0;
    }
    .status-dot.present { background: #4CAF50; box-shadow: 0 0 16px rgba(76,175,80,0.4); }
    .status-dot.absent { background: #f44336; box-shadow: 0 0 16px rgba(244,67,54,0.4); }
    .status-dot.unknown { background: #FF9800; box-shadow: 0 0 16px rgba(255,152,0,0.4); }
    .attendance-info .label {
      font-size: 12px;
      color: #888;
      font-weight: 600;
      text-transform: uppercase;
      letter-spacing: 0.03em;
    }
    .attendance-info .status-text {
      font-family: var(--font-display);
      font-size: 18px;
      font-weight: 600;
      color: #fff;
      margin-top: 2px;
    }
    .attendance-actions { display: flex; gap: 10px; flex-wrap: wrap; }
    .attendance-actions button { min-width: 100px; }

    .tabs { display: flex; gap: 8px; margin-bottom: 20px; flex-wrap: wrap; }
    .tabs button {
      background: rgba(255,255,255,0.05);
      color: #888;
      padding: 10px 24px;
      font-size: 14px;
      font-weight: 600;
      border-radius: 10px;
      border: 1px solid #333;
      cursor: pointer;
      transition: all 0.2s ease;
      flex: 1 1 auto;
    }
    .tabs button:hover { color: var(--green-500); border-color: var(--green-500); background: rgba(49,233,129,0.05); }
    .tabs button.active { background: rgba(49,233,129,0.12); color: var(--green-500); border-color: var(--green-500); }
    .tabs button .count { background: rgba(255,255,255,0.1); padding: 0 8px; border-radius: 4px; font-size: 12px; margin-left: 6px; }
    .tabs button.active .count { background: rgba(49,233,129,0.2); }

    .job-card {
      background: linear-gradient(145deg, rgba(16, 27, 20, 0.95), rgba(8, 14, 10, 0.95));
      border: 1px solid rgba(72, 255, 151, 0.1);
      border-radius: 14px;
      padding: 18px 20px;
      margin-bottom: 14px;
      transition: all 0.25s ease;
    }
    .job-card:hover { border-color: rgba(72,255,151,0.3); transform: translateY(-2px); box-shadow: 0 12px 40px rgba(0,0,0,0.3); }
    .job-header {
      display: flex;
      justify-content: space-between;
      align-items: flex-start;
      margin-bottom: 10px;
      flex-wrap: wrap;
      gap: 6px;
    }
    .job-order { font-size: 12px; color: #888; font-family: monospace; }
    .job-customer { font-size: 18px; font-weight: 600; color: #fff; margin-top: 2px; }
    .job-details {
      display: flex;
      flex-wrap: wrap;
      gap: 16px;
      font-size: 13px;
      color: #aaa;
      padding: 8px 0 12px;
      border-bottom: 1px solid rgba(255,255,255,0.05);
    }
    .job-details span { display: flex; align-items: center; gap: 4px; }
    .job-checklist { padding: 12px 0 8px; }
    .checklist-label {
      font-size: 12px;
      color: #888;
      font-weight: 600;
      text-transform: uppercase;
      letter-spacing: 0.03em;
      margin-bottom: 8px;
    }
    .checklist-item {
      display: flex;
      align-items: center;
      gap: 10px;
      padding: 4px 0;
      font-size: 14px;
      color: #ddd;
      cursor: pointer;
      transition: color 0.2s ease;
    }
    .checklist-item.done { color: #666; text-decoration: line-through; }
    .checklist-item input[type="checkbox"] { width: 18px; height: 18px; cursor: pointer; accent-color: var(--green-500); }
    .job-actions {
      display: flex;
      flex-wrap: wrap;
      gap: 8px;
      margin-top: 14px;
      padding-top: 14px;
      border-top: 1px solid rgba(255,255,255,0.05);
    }
    .job-actions button {
      flex: 1;
      min-width: 80px;
      min-height: 40px;
      font-size: 13px;
      font-weight: 600;
    }

    .btn-success {
      background: linear-gradient(135deg, #4CAF50, #388E3C);
      color: #fff;
      border: none;
      border-radius: 8px;
      padding: 10px 16px;
      cursor: pointer;
      transition: all 0.2s ease;
      font-weight: 600;
    }
    .btn-success:hover { transform: translateY(-2px); box-shadow: 0 8px 24px rgba(76,175,80,0.3); }

    .empty-state { text-align: center; padding: 60px 20px; color: #aaa; }
    .empty-state .icon { font-size: 48px; margin-bottom: 16px; }
    .empty-state h3 { color: #fff; font-size: 18px; margin-bottom: 8px; }
    .empty-state p { font-size: 14px; }

    /* Complete modal */
    #completeModalOverlay .modal { max-width: 480px; }
    .complete-summary {
      background: rgba(255,255,255,0.03);
      border-radius: 10px;
      padding: 16px;
      margin: 12px 0 16px;
    }
    .complete-summary .row {
      display: flex;
      justify-content: space-between;
      padding: 6px 0;
      font-size: 14px;
      color: #ccc;
    }
    .complete-summary .row .label { color: #888; }
    .complete-summary .row .value { color: #fff; font-weight: 500; }
    .complete-amount-input { margin-top: 12px; }
    .complete-amount-input label {
      display: block;
      color: #ccc;
      font-size: 13px;
      font-weight: 600;
      margin-bottom: 6px;
    }
    .complete-amount-input input {
      width: 100%;
      padding: 12px 16px;
      border-radius: 8px;
      border: 1px solid #333;
      background: #1a1a1a;
      color: #fff;
      font-size: 18px;
      font-weight: 600;
    }
    .complete-amount-input input:focus { border-color: var(--green-500); outline: none; }

    /* Add job modal */
    .complaint-entry-row { display: flex; gap: 9px; margin-top: 8px; }
    .complaint-entry-row input { flex: 1; }

    @keyframes fadeIn { from { opacity: 0; } to { opacity: 1; } }
    @keyframes slideUp { from { opacity: 0; transform: translateY(20px); } to { opacity: 1; transform: translateY(0); } }
    @keyframes glow { 0%,100% { box-shadow: 0 0 10px rgba(49,233,129,0.3); } 50% { box-shadow: 0 0 25px rgba(49,233,129,0.6); } }

    @media (max-width: 600px) {
      .mech-topbar { flex-direction: column; align-items: stretch; }
      .mech-user { justify-content: space-between; }
      .attendance-card { flex-direction: column; align-items: stretch; }
      .attendance-actions { flex-direction: column; }
      .attendance-actions button { min-width: unset; }
      .tabs button { flex: 1; text-align: center; padding: 8px 12px; font-size: 13px; }
      .job-header { flex-direction: column; gap: 6px; }
      .job-actions { flex-direction: column; }
      .job-actions button { flex: unset; width: 100%; }
    }
  </style>
</head>
<body>
<div class="mech-shell">

  <!-- Top Bar -->
  <div class="mech-topbar">
    <div class="brand"><span class="dot"></span>Velo - garage os</div>
    <div class="mech-user">
      <div class="mech-user-info">
        <div class="name" id="mechNameDisplay">Loading...</div>
        <div class="code" id="mechCodeDisplay">---</div>
      </div>
      <div class="mech-avatar" id="mechAvatar">M</div>
      <button class="btn-primary" id="newJobBtn" style="padding:6px 14px;font-size:13px;">+ New Job</button>
      <button class="btn-ghost" id="logoutBtn" style="padding:6px 14px;font-size:13px;">Log out</button>
    </div>
  </div>

  <!-- Attendance Card -->
  <div class="card attendance-card">
    <div class="attendance-left">
      <div class="status-dot unknown" id="attStatusDot"></div>
      <div class="attendance-info">
        <div class="label">Today's Attendance</div>
        <div class="status-text" id="attStatusText">Loading...</div>
      </div>
    </div>
    <div class="attendance-actions">
      <button class="btn-ghost" id="checkInBtn">📥 Check In</button>
      <button class="btn-primary" id="checkOutBtn">📤 Check Out</button>
    </div>
  </div>

  <!-- Tabs -->
  <div class="tabs">
    <button data-tab="pending" class="active">📋 Pending <span class="count" id="pendingCount">0</span></button>
    <button data-tab="ongoing">🔧 Ongoing <span class="count" id="ongoingCount">0</span></button>
  </div>

  <!-- Job List -->
  <div id="jobList"></div>
</div>

<!-- ===== Complete Job Modal ===== -->
<div class="modal-overlay" id="completeModalOverlay" style="display:none">
  <div class="modal" role="dialog" aria-modal="true">
    <div class="modal-head">
      <h3 id="completeModalTitle">✅ Complete Job</h3>
      <button class="modal-close" data-close-modal="completeModalOverlay">&times;</button>
    </div>
    <div class="modal-body">
      <input type="hidden" id="completeJobId" />
      <p style="color:#aaa;font-size:14px;margin-bottom:12px;">Enter the final amount for this job before marking it as completed.</p>
      <div class="complete-summary">
        <div class="row"><span class="label">Order</span><span class="value" id="completeOrder">---</span></div>
        <div class="row"><span class="label">Customer</span><span class="value" id="completeCustomer">---</span></div>
        <div class="row"><span class="label">Bike</span><span class="value" id="completeBike">---</span></div>
      </div>
      <div class="complete-amount-input">
        <label>Final Amount (₹)</label>
        <input type="number" id="completeAmount" min="0" step="1" placeholder="Enter amount" />
      </div>
      <button class="btn-success" onclick="window.submitCompleteJob()" style="width:100%;margin-top:16px;padding:12px;">
        ✅ Complete & Notify Customer
      </button>
    </div>
  </div>
</div>

<!-- ===== Add Job Modal ===== -->
<div class="modal-overlay" id="jobModalOverlay" style="display:none">
  <div class="modal" role="dialog" aria-modal="true" aria-labelledby="jobModalTitle">
    <div class="modal-head">
      <h3 id="jobModalTitle">New Job</h3>
      <button class="modal-close" data-close-modal="jobModalOverlay" type="button" aria-label="Close job form">&times;</button>
    </div>
    <div class="modal-body">
      <form id="jobForm">
        <input type="hidden" id="jobId" />
        <div class="grid grid-2">
          <div class="field"><label>Customer Name</label><input id="customer_name" required /></div>
          <div class="field"><label>Phone Number</label><input id="phone_number" type="tel" required /></div>
          <div class="field"><label>Bike Model</label><input id="bike_model" required /></div>
          <div class="field"><label>Bike Number</label><input id="bike_number" required /></div>
        </div>
        <div class="field">
          <label>Complaints / To-do Checklist</label>
          <div id="complaintList"></div>
          <div class="complaint-entry-row">
            <input id="newComplaintText" placeholder="e.g. Engine noise" />
            <button type="button" class="btn-ghost" id="addComplaintBtn">Add</button>
          </div>
        </div>
        <div class="field" style="display:none;">
          <label>Assign Mechanic</label>
          <input type="text" id="mechanic_name_display" readonly />
        </div>
        <div class="field">
          <label>Estimated Amount (₹)</label>
          <input id="amount" type="number" min="0" value="0" inputmode="decimal" />
        </div>
        <button class="btn-primary" type="submit" style="width:100%;margin-top:6px">Save Job</button>
      </form>
    </div>
  </div>
</div>

<!-- Toast & Lock Screen -->
<div class="toast" id="toast"></div>
<div id="lockScreenRoot"></div>

<script src="/js/common.js"></script>
<script src="/js/mechanic.js"></script>
</body>
</html>
